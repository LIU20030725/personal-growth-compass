<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>能力模块 V4 独立验收标注</title>
  <style>
    body{margin:0;padding:32px;background:#f4f3ef;color:#202428;font:15px/1.55 system-ui,sans-serif}main{max-width:1180px;margin:auto}figure{margin:28px 0;padding:16px;background:#fff;border:1px solid #d6d1c5}.shot{position:relative}.shot img{display:block;width:100%;height:auto}.mark{position:absolute;box-sizing:border-box;border:3px solid #d98400;background:rgba(255,185,44,.14)}.mark.good{border-color:#2f7a54;background:rgba(63,160,108,.12)}.mark b{position:absolute;top:-30px;left:-3px;padding:3px 8px;background:#d98400;color:#fff}.mark.good b{background:#2f7a54}figcaption{margin-top:12px;font-weight:650}
  </style>
</head>
<body><main>
  <h1>能力模块 V4 独立验收标注</h1>
  <p>橙色为 Severity 2 的轻微问题，绿色为应保留的优点。坐标来自 annotations.json。</p>
  <figure><div class="shot"><img src="screenshots/01-1440-parallel-candidates.png" alt="桌面并行候选画布"><span class="mark" style="left:50%;top:32%;width:45%;height:8%"><b>F-01</b></span></div><figcaption>F-01：画布工具条同时呈现 7 个操作，首次使用时扫描成本偏高。</figcaption></figure>
  <figure><div class="shot"><img src="screenshots/05-390-mobile-detail.png" alt="移动端节点详情"><span class="mark" style="left:0;top:0;width:100%;height:19%"><b>F-02</b></span></div><figcaption>F-02：底部详情打开后仍露出被遮挡的背景操作区，视觉层级略有干扰。</figcaption></figure>
  <figure><div class="shot"><img src="screenshots/00-1440-empty.png" alt="桌面空态"><span class="mark good" style="left:21%;top:61%;width:74%;height:34%"><b>P-01</b></span></div><figcaption>P-01：空态清楚说明下一步，并把“创建第一棵技能树”作为单一主操作。</figcaption></figure>
</main></body></html>
