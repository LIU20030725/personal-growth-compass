<!doctype html>
<meta charset="utf-8">
<title>Emotion V1 migration acceptance fixture</title>
<script>
  const entries = Array.from({ length: 11 }, (_, index) => {
    const day = String(index + 1).padStart(2, "0");
    const iso = `2026-08-${day}T08:00:00.000Z`;
    return {
      id: `legacy-${index + 1}`,
      createdAt: iso,
      updatedAt: iso,
      moodId: index % 2 === 0 ? "calm" : "happy",
      activityIds: ["reading"],
      note: `V1 historical record ${index + 1}`,
      attachments: [],
      isFavorite: false,
    };
  });

  entries.push({
    id: "legacy-memory",
    createdAt: "2025-08-12T08:00:00.000Z",
    updatedAt: "2025-08-12T08:00:00.000Z",
    moodId: "grateful",
    activityIds: ["travel"],
    note: "On this day last year",
    attachments: [],
    isFavorite: true,
  });

  localStorage.setItem(
    "dice-life.emotion.v1",
    JSON.stringify({ schemaVersion: 1, entries }),
  );
  location.replace("/");
</script>
<p>Preparing the V1 migration acceptance fixture...</p>
